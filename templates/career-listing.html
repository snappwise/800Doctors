    <script>
        const jobsPerPage = 9;
        let currentPage = 1;
        let totalPages = 0;
    
        // Function to fetch job openings
        function fetchJobs(page) {
            fetch(`/api/job-openings/?page=${page}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    renderJobs(data.results);
                    const pagination = getPagination(data);
                    renderPagination(pagination);
                })
                .catch(error => {
                    console.error('Error fetching job openings:', error);
                });
        }
    
        // Function to render job data
        function renderJobs(jobs) {
            const jobContainer = document.getElementById('job-cards-container');
            jobContainer.innerHTML = '';
    
            jobs.forEach(job => {
                const jobCard = `
                    <div class="career-page-card card-shadow">
                        <img src="${job.position_image}" alt="${job.position_name} Image" />
                        <div class="service-page-card-content">
                            <div class="career-page-card-header">
                                <span class="career-page-card-badge">${job.category}</span>
                                <h5 class="card-heading">${job.position_name}</h5>
                            </div>
                            <p class="service-page-card-desc">${job.position_desc}</p>
                            <div class="flex items-center gap-2 text-gray-900 font-medium my-2">
                                <i class="bi bi-person-fill text-xl"></i>
                                <span>Available Positions: ${job.available_pos}</span>
                            </div>
                            <a class="cta-primary" href="/careers/${job.id}">Apply Now</a>
                        </div>
                    </div>
                `;
                jobContainer.insertAdjacentHTML('beforeend', jobCard);
            });
        }
    
        // Function to extract pagination data from the API response
        function getPagination(data) {
            const totalPages = Math.ceil(data.count / jobsPerPage);
            const currentPage = data.next ? 
                Number(new URL(data.next).searchParams.get('page')) - 1 : 
                totalPages;
    
            return {
                current_page: currentPage,
                total_pages: totalPages,
                has_previous: currentPage > 1,
                has_next: currentPage < totalPages
            };
        }
    
        // Function to render pagination
        function renderPagination(pagination) {
            const paginationContainer = document.getElementById('pagination-container');
            paginationContainer.innerHTML = '';
    
            // Hide pagination if total pages is 1 or less
            if (pagination.total_pages <= 1) {
                paginationContainer.style.display = 'none';
                return;
            }
    
            totalPages = pagination.total_pages;
            currentPage = pagination.current_page;
    
            // Only render prev/next and page numbers if more than 3 pages
            if (totalPages > 3) {
                // Previous button
                const prevButton = `
                    <li>
                        <a href="#" class="pagination-link rounded-s-lg border-e-0 ms-0 ${currentPage === 1 ? 'disabled' : ''}" data-page="${currentPage - 1}">
                            <span class="sr-only">Previous</span>
                            <svg class="pagination-arrow-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 1 1 5l4 4"/>
                            </svg>
                        </a>
                    </li>
                `;
                paginationContainer.insertAdjacentHTML('beforeend', prevButton);
            }
    
            // Page number buttons (show max 3 pages)
            const startPage = Math.max(1, Math.min(currentPage - 1, totalPages - 2));
            const endPage = Math.min(totalPages, startPage + 2);
    
            for (let i = startPage; i <= endPage; i++) {
                const pageButton = `
                <li>
                    <a href="#" class="pagination-link ${i === currentPage ? 'active bg-blue-500 text-white' : ''}" data-page="${i}">${i}</a>
                </li>
            `;
                paginationContainer.insertAdjacentHTML('beforeend', pageButton);
            }
    
            // Only render prev/next if more than 3 pages
            if (totalPages > 3) {
                // Next button
                const nextButton = `
                    <li>
                        <a href="#" class="pagination-link rounded-e-lg ${currentPage === totalPages ? 'disabled' : ''}" data-page="${currentPage + 1}">
                            <span class="sr-only">Next</span>
                            <svg class="pagination-arrow-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
                            </svg>
                        </a>
                    </li>
                `;
                paginationContainer.insertAdjacentHTML('beforeend', nextButton);
            }
    
            // Show pagination container
            paginationContainer.style.display = 'flex';
        }
    
        function handlePaginationClick(e) {
            const link = e.target.closest('a.pagination-link');
            if (!link) return;
    
            const page = Number(link.getAttribute('data-page'));
    
            // If the link is disabled, don't do anything
            if (link.classList.contains('disabled')) return;
    
            // Ensure the page is valid and within range
            if (!isNaN(page) && page >= 1 && page <= totalPages) {
                currentPage = page;
                fetchJobs(currentPage);
            }
        }
    
        // Adding event listener for pagination click
        document.getElementById('pagination-container').addEventListener('click', handlePaginationClick);
    
        // Initialize with the first page
        fetchJobs(currentPage);
    </script>
    

    {% include 'footer.html' %}
    <script src="{% static 'scripts/whatsapp.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="{% static 'scripts/swiper.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.4.1/dist/flowbite.min.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

</body>
